name: agnix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin & marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agnix
        uses: agent-sh/agnix@bf1edd94cd9e14a834039526b574689d421efa7c # v0.56.5
        with:
          version: v0.56.5
          target: claude-code
          config: .agnix.toml
          fail-on-error: 'true'
